<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>aluno.san</title>

  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon-192.png">
  <meta name="theme-color" content="#2e7d32" />

  <link rel="stylesheet" href="/style.css">
  <!-- Botão de instalação do WebApp -->
<div id="installArea" style="text-align:center; margin: 16px;">
  <button
    id="installBtn"
    style="
      display:none;
      background:#43933C;
      color:#fff;
      border:none;
      border-radius:12px;
      padding:12px 16px;
      font-weight:800;
      font-size:15px;
      cursor:pointer;
      box-shadow:0 2px 8px rgba(0,0,0,.15);
    "
  >
    📲 Instalar WebApp
  </button>
</div>

<script>
  let deferredPrompt = null;

  const installBtn = document.getElementById("installBtn");

  const userAgent = navigator.userAgent || navigator.vendor || window.opera;

  const isAndroid = /android/i.test(userAgent);
  const isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;

  const isStandalone =
    window.matchMedia("(display-mode: standalone)").matches ||
    window.navigator.standalone === true;

  if (!isStandalone && isIOS) {
    installBtn.style.display = "inline-block";
    installBtn.textContent = "📲 Como instalar no iPhone";
    installBtn.onclick = () => {
      window.location.href = "/instalar/";
    };
  }

  if (!isStandalone && isAndroid) {
    installBtn.style.display = "inline-block";
    installBtn.textContent = "📲 Instalar WebApp";
  }

  window.addEventListener("beforeinstallprompt", (event) => {
    event.preventDefault();
    deferredPrompt = event;

    if (!isStandalone && isAndroid) {
      installBtn.style.display = "inline-block";
      installBtn.textContent = "📲 Instalar WebApp";
    }
  });

  installBtn.addEventListener("click", async () => {
    if (isIOS) {
      window.location.href = "/instalar/";
      return;
    }

    if (!deferredPrompt) {
      window.location.href = "/instalar/";
      return;
    }

    deferredPrompt.prompt();

    await deferredPrompt.userChoice;

    deferredPrompt = null;
    installBtn.style.display = "none";
  });

  window.addEventListener("appinstalled", () => {
    deferredPrompt = null;
    installBtn.style.display = "none";
  });
</script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">aluno.san</div>
      <div class="subtitle">Acesso rápido aos módulos do Campus</div>
    </div>
  </header>

  <main class="container">
    <section class="list" id="modulesList"></section>

    <!-- Professores SEMPRE por último -->
    <section class="list" id="profCardSlot"></section>
  </main>

  <div id="modalRoot"></div>

  <script src="/app.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/service-worker.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
