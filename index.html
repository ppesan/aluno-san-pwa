<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>aluno.san</title>

  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon-192.png">
  <meta name="theme-color" content="#2e7d32" />

  <link rel="stylesheet" href="/style.css">
</head>

<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">aluno.san</div>
      <div class="subtitle">Acesso rápido aos módulos do Campus</div>
    </div>
  </header>

  <main class="container">

    <section style="
      display:flex;
      gap:10px;
      justify-content:center;
      align-items:center;
      flex-wrap:wrap;
      margin:16px 0;
    ">
      <button id="installBtn" style="
        display:none;
        background:#43933C;
        color:#fff;
        border:none;
        border-radius:14px;
        padding:12px 16px;
        font-weight:800;
        font-size:15px;
        cursor:pointer;
        box-shadow:0 2px 8px rgba(0,0,0,.15);
      ">
        📲 Instalar WebApp
      </button>

      <button id="verAvisosBtn" style="
        display:none;
        background:#ffffff;
        color:#2e7d32;
        border:2px solid #43933C;
        border-radius:14px;
        padding:10px 16px;
        font-weight:800;
        font-size:15px;
        cursor:pointer;
        box-shadow:0 2px 8px rgba(0,0,0,.08);
      ">
        🔔 Ver avisos
      </button>

      <button id="updateAppBtn" style="
        display:none;
        background:#1f6feb;
        color:#fff;
        border:none;
        border-radius:14px;
        padding:12px 16px;
        font-weight:800;
        font-size:15px;
        cursor:pointer;
        box-shadow:0 2px 8px rgba(0,0,0,.15);
      ">
        🔄 Atualizar app
      </button>
    </section>

    <section class="list" id="modulesList"></section>
  </main>

  <div id="modalRoot"></div>

  <script src="/app.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/service-worker.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
